<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cutmat</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--mat:#2E5A4E;--grid:#3A6C5E;--grid2:#4F8574;--paper:#E9EEEC;--ink:#17201D;--tape:#F2C230;--line:#C9D3CF;--soft:#5B6763;
--checker:conic-gradient(#d9dedc 25%,#fff 0 50%,#d9dedc 0 75%,#fff 0) 0 0/20px 20px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--ink);background:var(--ink);display:grid;grid-template-rows:auto 1fr;height:100dvh;overflow:hidden;font-size:15px}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--ink);color:var(--paper)}
.brand{font-weight:800;font-size:23px;letter-spacing:-.03em;margin-right:auto}
.btn{font:inherit;font-weight:600;font-size:14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:8px 13px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
header .btn{border-color:var(--paper);color:var(--paper)}
.btn.primary,header .btn.primary{background:var(--tape);border-color:var(--tape);color:var(--ink)}
main{display:grid;grid-template-columns:1fr 380px;min-height:0}
.stage{position:relative;display:flex;align-items:center;justify-content:center;padding:28px;min-height:0;overflow:hidden;background-color:var(--mat);
background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
background-size:120px 120px,120px 120px,24px 24px,24px 24px;background-position:center}
canvas{max-width:100%;max-height:100%;touch-action:none;background:var(--checker);box-shadow:0 2px 0 rgba(0,0,0,.25),0 22px 44px rgba(0,0,0,.35);display:block}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;pointer-events:none;padding:30px}
.empty p{margin:0;font-size:20px;font-weight:600;max-width:20ch;line-height:1.25}
.empty .btn{pointer-events:auto}
.pickbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--tape);font-weight:600;padding:8px 14px;border-radius:999px;font-size:14px;display:none;white-space:nowrap}
.picking .pickbar{display:block}.picking canvas{cursor:crosshair}
.panel{background:var(--paper);overflow:auto;min-height:0;border-left:2px solid var(--ink)}
.tabs{position:sticky;top:0;display:flex;background:var(--paper);border-bottom:1.5px solid var(--line);z-index:2}
.tabs button{flex:1;font:inherit;font-weight:600;padding:13px 4px;border:0;background:none;color:var(--soft);border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.body{padding:14px 16px 48px;display:grid;gap:14px}
h3{margin:6px 0 0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.muted{color:var(--soft);font-size:14px;margin:0;line-height:1.45}
.ctl{display:grid;gap:3px;font-size:14px}
.ctl>span{display:flex;justify-content:space-between}
output{font-variant-numeric:tabular-nums;color:var(--soft)}
input[type=range]{width:100%;accent-color:var(--ink);margin:4px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{accent-color:var(--ink);width:18px;height:18px}
.layers{display:grid;gap:6px}
.layer{display:flex;align-items:center;gap:8px;padding:6px;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.layer.sel{border-color:var(--ink);box-shadow:inset 5px 0 0 var(--tape)}
.layer.hidden img{opacity:.3}
.layer img{width:42px;height:42px;object-fit:contain;background:var(--checker);border-radius:6px}
.layer .nm{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{font:inherit;border:0;background:none;padding:6px 7px;cursor:pointer;color:var(--ink);font-size:15px;border-radius:6px;line-height:1}
.ib:hover{background:var(--line)}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{flex:1;font:inherit;font-weight:600;font-size:14px;padding:8px;border:0;background:none;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
.fx{border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;display:grid;gap:8px}
.fx.off .ctl{opacity:.45}
.fxhead{display:flex;align-items:center;gap:2px}
.fxhead strong{flex:1;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;font-weight:600;border:1.5px dashed var(--ink);background:none;border-radius:999px;padding:7px 12px;cursor:pointer;color:var(--ink)}
.chip:hover{background:var(--tape);border-style:solid}
input[type=color]{width:44px;height:34px;border:1.5px solid var(--ink);border-radius:8px;padding:2px;background:#fff;cursor:pointer}
select{font:inherit;font-size:14px;padding:7px 8px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(23,32,29,.82);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.open{display:flex}
.sheet{background:var(--paper);border-radius:14px;padding:16px;max-width:560px;width:100%;display:grid;gap:12px}
.sheet img{max-width:100%;max-height:60dvh;object-fit:contain;background:var(--checker);justify-self:center}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
@media (max-width:820px){
 main{grid-template-columns:1fr;grid-template-rows:50dvh 1fr}
 .panel{border-left:0;border-top:2px solid var(--ink)}
 .stage{padding:14px}
 header .hide-sm{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand">Cutmat</div>
  <label class="btn hide-sm" for="file">Add images</label>
  <button class="btn primary" data-act="export">Export PNG</button>
</header>
<main>
  <section class="stage" id="stage">
    <canvas id="board" width="1080" height="1350" aria-label="Collage artboard"></canvas>
    <div class="empty" id="empty"><p>Drop in photos, scans or green-screen shots to start</p><label class="btn primary" for="file">Add images</label></div>
    <div class="pickbar">Tap the colour you want to remove</div>
  </section>
  <aside class="panel" id="panel"></aside>
</main>
<input type="file" id="file" accept="image/*" multiple hidden>
<div class="modal" id="modal"><div class="sheet">
  <h3>Your collage</h3>
  <img id="outImg" alt="Exported collage">
  <p class="muted">Long-press the image to save it on your phone, or download the PNG.</p>
  <div class="row"><a class="btn primary" id="dl" download="cutmat.png">Download PNG</a><button class="btn" data-act="close">Close</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const cv=$('#board'),bctx=cv.getContext('2d'),panel=$('#panel'),stage=$('#stage');
const MAXD=1200,PAD=60;let uid=1;
const S={layers:[],sel:null,tab:'layers',pick:false,board:{w:1080,h:1350,bg:'#ffffff',transparent:false}};
const CHEAP=new Set(['x','y','scale','rot','opacity','blend','visible','flip','name']);
const BLENDS=[['source-over','Normal'],['multiply','Multiply'],['screen','Screen'],['overlay','Overlay'],['darken','Darken'],['lighten','Lighten'],['color-dodge','Colour dodge'],['color-burn','Colour burn'],['hard-light','Hard light'],['soft-light','Soft light'],['difference','Difference'],['exclusion','Exclusion'],['hue','Hue'],['saturation','Saturation'],['color','Colour'],['luminosity','Luminosity']];
const ASPECTS=[['1:1',1080,1080],['4:5',1080,1350],['9:16',1080,1920],['16:9',1920,1080]];

const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c};
const ctx2=c=>c.getContext('2d',{willReadFrequently:true});
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hex=c=>'#'+c.map(v=>(v|0).toString(16).padStart(2,'0')).join('');
const rgbOf=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const fmt=v=>typeof v==='number'?(Number.isInteger(v)?v:v.toFixed(2)):v;
const cur=()=>S.layers.find(l=>l.id===S.sel)||null;

/* ---------- Effects ---------- */
const FX={
 rgb:{name:'RGB split',params:[['amount','Offset',0,80,1,14],['angle','Angle',0,360,1,0]],run(c,p){
  const w=c.width,h=c.height,x=ctx2(c),s=x.getImageData(0,0,w,h).data,out=x.createImageData(w,h),o=out.data;
  const a=p.angle*Math.PI/180,dx=Math.round(Math.cos(a)*p.amount),dy=Math.round(Math.sin(a)*p.amount);
  for(let y=0;y<h;y++)for(let X=0;X<w;X++){const i=(y*w+X)*4;let r=0,ra=0,b=0,ba=0;
   const rx=X-dx,ry=y-dy,bx=X+dx,by=y+dy;
   if(rx>=0&&rx<w&&ry>=0&&ry<h){const j=(ry*w+rx)*4;r=s[j];ra=s[j+3]}
   if(bx>=0&&bx<w&&by>=0&&by<h){const j=(by*w+bx)*4;b=s[j+2];ba=s[j+3]}
   const ga=s[i+3],A=Math.max(ra,ga,ba);
   if(A){o[i]=r*ra/A;o[i+1]=s[i+1]*ga/A;o[i+2]=b*ba/A;o[i+3]=A}}
  x.putImageData(out,0,0)}},
 glitch:{name:'Glitch slices',random:true,params:[['slices','Slices',0,40,1,12],['shift','Shift',0,250,1,50]],run(c,p,seed){
  const w=c.width,h=c.height,x=ctx2(c),r=rng(seed),cp=mk(w,h);cp.getContext('2d').drawImage(c,0,0);
  for(let n=0;n<p.slices;n++){const y0=Math.floor(r()*h),sh=Math.max(2,Math.floor(r()*h*.06)),dx=Math.round((r()*2-1)*p.shift);
   x.clearRect(0,y0,w,sh);x.drawImage(cp,0,y0,w,sh,dx,y0,w,sh)}}},
 halftone:{name:'Halftone',params:[['size','Dot size',4,40,1,10],['under','Original underneath',0,1,.01,0]],run(c,p){
  const w=c.width,h=c.height,x=ctx2(c),s=x.getImageData(0,0,w,h).data,cp=mk(w,h),z=p.size;cp.getContext('2d').drawImage(c,0,0);
  x.clearRect(0,0,w,h);if(p.under>0){x.globalAlpha=p.under;x.drawImage(cp,0,0);x.globalAlpha=1}
  for(let cy=0;cy<h;cy+=z)for(let cx=0;cx<w;cx+=z){const sx=Math.min(w-1,cx+z/2|0),sy=Math.min(h-1,cy+z/2|0),j=(sy*w+sx)*4,a=s[j+3];if(a<20)continue;
   const L=(.299*s[j]+.587*s[j+1]+.114*s[j+2])/255,rad=z*.5*Math.sqrt(1-L)*1.35+z*.08;
   x.fillStyle=`rgba(${s[j]},${s[j+1]},${s[j+2]},${a/255})`;x.beginPath();x.arc(cx+z/2,cy+z/2,rad,0,7);x.fill()}}},
 duotone:{name:'Duotone',params:[['dark','Shadows','color','#1d2470'],['light','Highlights','color','#ff6fa8'],['mix','Mix',0,1,.01,1]],run(c,p){
  const x=ctx2(c),id=x.getImageData(0,0,c.width,c.height),d=id.data,A=rgbOf(p.dark),B=rgbOf(p.light),m=p.mix;
  for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;const L=(.299*d[i]+.587*d[i+1]+.114*d[i+2])/255;
   for(let k=0;k<3;k++)d[i+k]=d[i+k]*(1-m)+(A[k]+(B[k]-A[k])*L)*m}x.putImageData(id,0,0)}},
 posterize:{name:'Posterize',params:[['levels','Levels',2,10,1,4]],run(c,p){
  const x=ctx2(c),id=x.getImageData(0,0,c.width,c.height),d=id.data,n=p.levels-1;
  for(let i=0;i<d.length;i+=4)for(let k=0;k<3;k++)d[i+k]=Math.round(d[i+k]/255*n)/n*255;x.putImageData(id,0,0)}},
 grain:{name:'Film grain',random:true,params:[['amount','Amount',0,100,1,25]],run(c,p,seed){
  const x=ctx2(c),id=x.getImageData(0,0,c.width,c.height),d=id.data,r=rng(seed),a=p.amount*2.55;
  for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;const n=(r()-.5)*a;d[i]+=n;d[i+1]+=n;d[i+2]+=n}x.putImageData(id,0,0)}},
 glow:{name:'Glow',params:[['radius','Radius',2,60,1,18],['strength','Strength',0,2,.05,.8]],run(c,p){
  const w=c.width,h=c.height,x=ctx2(c),f=Math.max(2,p.radius/2),s1=mk(w/f,h/f),s2=mk(s1.width/2,s1.height/2);
  const a=s1.getContext('2d'),b=s2.getContext('2d');a.imageSmoothingQuality=b.imageSmoothingQuality='high';
  a.drawImage(c,0,0,s1.width,s1.height);b.drawImage(s1,0,0,s2.width,s2.height);
  x.save();x.globalCompositeOperation='lighter';x.imageSmoothingQuality='high';
  x.globalAlpha=Math.min(1,p.strength);x.drawImage(s2,0,0,w,h);
  if(p.strength>1){x.globalAlpha=p.strength-1;x.drawImage(s1,0,0,w,h)}x.restore()}},
 outline:{name:'Sticker outline',params:[['thick','Thickness',1,40,1,10],['color','Colour','color','#ffffff']],run(c,p){
  const w=c.width,h=c.height,x=ctx2(c),sil=mk(w,h),sx=sil.getContext('2d'),o=mk(w,h),ox=o.getContext('2d'),t=p.thick;
  sx.drawImage(c,0,0);sx.globalCompositeOperation='source-in';sx.fillStyle=p.color;sx.fillRect(0,0,w,h);
  const n=Math.min(48,Math.max(16,t*2));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;ox.drawImage(sil,Math.cos(a)*t,Math.sin(a)*t)}
  ox.drawImage(sil,0,0);ox.drawImage(c,0,0);x.clearRect(0,0,w,h);x.drawImage(o,0,0)}},
 shadow:{name:'Drop shadow',params:[['dist','Distance',0,60,1,14],['angle','Angle',0,360,1,60],['blur','Blur',0,40,1,12],['opacity','Opacity',0,1,.01,.45]],run(c,p){
  const w=c.width,h=c.height,x=ctx2(c),sil=mk(w,h),sx=sil.getContext('2d');
  sx.drawImage(c,0,0);sx.globalCompositeOperation='source-in';sx.fillStyle='#000';sx.fillRect(0,0,w,h);
  let src=sil;if(p.blur>0){const f=Math.max(1.5,p.blur/2),s1=mk(w/f,h/f),s2=mk(s1.width/2,s1.height/2);
   s1.getContext('2d').drawImage(sil,0,0,s1.width,s1.height);s2.getContext('2d').drawImage(s1,0,0,s2.width,s2.height);src=s2}
  const a=p.angle*Math.PI/180,o=mk(w,h),ox=o.getContext('2d');ox.globalAlpha=p.opacity;ox.imageSmoothingQuality='high';
  ox.drawImage(src,Math.cos(a)*p.dist,Math.sin(a)*p.dist,w,h);ox.globalAlpha=1;ox.drawImage(c,0,0);
  x.clearRect(0,0,w,h);x.drawImage(o,0,0)}},
 scan:{name:'Scanlines',params:[['gap','Spacing',2,16,1,4],['dark','Darkness',0,1,.01,.35]],run(c,p){
  const w=c.width,x=ctx2(c),id=x.getImageData(0,0,w,c.height),d=id.data,g=p.gap,k=1-p.dark;
  for(let i=0;i<d.length;i+=4){const y=(i/4/w)|0;if(y%g<g/2){d[i]*=k;d[i+1]*=k;d[i+2]*=k}}x.putImageData(id,0,0)}}
};

/* ---------- Keying ---------- */
function applyKey(c,k){
 const x=ctx2(c),id=x.getImageData(0,0,c.width,c.height),d=id.data;
 if(k.mode==='chroma'){
  const[kr,kg,kb]=k.color,kcb=-.168736*kr-.331264*kg+.5*kb,kcr=.5*kr-.418688*kg-.081312*kb;
  const dom=kg>=kr&&kg>=kb?1:(kb>=kr?2:0),tol=k.tol,soft=Math.max(.001,k.soft),sp=k.spill;
  for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;const r=d[i],g=d[i+1],b=d[i+2];
   const cb=-.168736*r-.331264*g+.5*b,cr=.5*r-.418688*g-.081312*b,dist=Math.hypot(cb-kcb,cr-kcr);
   const a=dist<=tol?0:dist>=tol+soft?1:(dist-tol)/soft;d[i+3]*=a;
   if(a>0&&sp>0){const v=d[i+dom],o=(d[i+(dom+1)%3]+d[i+(dom+2)%3])/2;if(v>o)d[i+dom]=v-(v-o)*sp}}
 }else if(k.mode==='luma'){
  const lo=k.lo,s=Math.max(.001,k.lsoft);
  for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;let L=(.299*d[i]+.587*d[i+1]+.114*d[i+2])/255;if(k.invert)L=1-L;
   d[i+3]*=L<=lo?0:L>=lo+s?1:(L-lo)/s}
 }
 x.putImageData(id,0,0);
}

/* ---------- Pipeline ---------- */
function process(L){
 const c=mk(L.src.width,L.src.height);ctx2(c).drawImage(L.src,0,0);
 if(L.key.mode!=='none')applyKey(c,L.key);
 for(const f of L.fx)if(f.on)FX[f.type].run(c,f.p,f.seed);
 L.out=c;L.dirty=false;
}
let raf=0;
function schedule(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;for(const L of S.layers)if(L.dirty)process(L);render(true)})}
function invalidate(L){L.dirty=true;schedule()}

function render(showSel){
 const B=S.board,x=bctx;x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.globalCompositeOperation='source-over';
 x.clearRect(0,0,B.w,B.h);if(!B.transparent){x.fillStyle=B.bg;x.fillRect(0,0,B.w,B.h)}
 for(const L of S.layers){if(!L.visible||!L.out)continue;x.save();x.translate(L.x,L.y);x.rotate(L.rot*Math.PI/180);
  x.scale(L.scale*(L.flip?-1:1),L.scale);x.globalAlpha=L.opacity;x.globalCompositeOperation=L.blend;
  x.drawImage(L.out,-L.out.width/2,-L.out.height/2);x.restore()}
 const L=cur();
 if(showSel&&L&&L.out&&L.visible){x.save();x.translate(L.x,L.y);x.rotate(L.rot*Math.PI/180);x.scale(L.scale,L.scale);
  const w=L.out.width-PAD*2,h=L.out.height-PAD*2,lw=3/L.scale;
  x.lineWidth=lw;x.strokeStyle='#17201D';x.strokeRect(-w/2,-h/2,w,h);
  x.setLineDash([14/L.scale,10/L.scale]);x.strokeStyle='#F2C230';x.strokeRect(-w/2,-h/2,w,h);x.restore()}
 $('#empty').style.display=S.layers.length?'none':'flex';
}

/* ---------- Loading ---------- */
function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url})}
async function addFiles(files){
 const B=S.board;
 for(const f of files){
  let img;try{img=await loadImg(URL.createObjectURL(f))}catch{continue}
  const sc=Math.min(1,MAXD/Math.max(img.width,img.height)),w=Math.round(img.width*sc),h=Math.round(img.height*sc);
  const src=mk(w+PAD*2,h+PAD*2);ctx2(src).drawImage(img,PAD,PAD,w,h);
  const t=mk(84,84),tx=t.getContext('2d'),ts=Math.min(84/w,84/h);tx.drawImage(img,(84-w*ts)/2,(84-h*ts)/2,w*ts,h*ts);
  const L={id:uid++,name:(f.name||'Image').replace(/\.[^.]+$/,''),src,thumb:t.toDataURL(),x:B.w/2,y:B.h/2,
   scale:+(Math.min(B.w/w,B.h/h)*.75).toFixed(2),rot:0,opacity:1,blend:'source-over',visible:true,flip:false,
   key:{mode:'none',color:[0,255,0],tol:40,soft:25,spill:.6,lo:.15,lsoft:.1,invert:false},fx:[],out:null,dirty:true};
  S.layers.push(L);S.sel=L.id;
 }
 schedule();renderPanel();
}
$('#file').addEventListener('change',e=>{addFiles([...e.target.files]);e.target.value=''});
stage.addEventListener('dragover',e=>e.preventDefault());
stage.addEventListener('drop',e=>{e.preventDefault();addFiles([...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')))});

/* ---------- Canvas interaction ---------- */
function toBoard(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]}
function toLocal(L,px,py){const dx=px-L.x,dy=py-L.y,a=-L.rot*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
 return[(dx*c-dy*s)/(L.scale*(L.flip?-1:1))+L.src.width/2,(dx*s+dy*c)/L.scale+L.src.height/2]}
function hitTest(px,py){for(let i=S.layers.length-1;i>=0;i--){const L=S.layers[i];if(!L.visible||!L.out)continue;
 const[lx,ly]=toLocal(L,px,py).map(Math.floor);if(lx<0||ly<0||lx>=L.out.width||ly>=L.out.height)continue;
 if(ctx2(L.out).getImageData(lx,ly,1,1).data[3]>16)return L}return null}
function doPick(px,py){const L=cur();if(!L)return;const[lx,ly]=toLocal(L,px,py).map(Math.floor);
 if(lx>=0&&ly>=0&&lx<L.src.width&&ly<L.src.height){const d=ctx2(L.src).getImageData(lx,ly,1,1).data;
  if(d[3]){L.key.color=[d[0],d[1],d[2]];L.key.mode='chroma';invalidate(L)}}
 setPick(false);renderPanel()}
function setPick(v){S.pick=v;stage.classList.toggle('picking',v)}
function syncTransform(){const L=cur();if(!L)return;for(const k of['scale','rot','x','y']){
 const i=panel.querySelector(`[data-bind="${k}"]`),o=panel.querySelector(`[data-out="${k}"]`);
 if(i)i.value=L[k];if(o)o.textContent=fmt(+(+L[k]).toFixed(2))}}
const ptrs=new Map();let drag=null,gest=null;
function startGesture(){const L=cur();if(!L)return;const[a,b]=[...ptrs.values()];
 gest={d:Math.hypot(b[0]-a[0],b[1]-a[1])||1,ang:Math.atan2(b[1]-a[1],b[0]-a[0]),s:L.scale,r:L.rot};drag=null}
function startDrag(px,py){const L=cur();drag=L?{sx:px,sy:py,lx:L.x,ly:L.y}:null}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const p=toBoard(e);ptrs.set(e.pointerId,p);
 if(S.pick){doPick(...p);return}
 if(ptrs.size===1){const hit=hitTest(...p);if(hit&&hit.id!==S.sel){S.sel=hit.id;renderPanel();schedule()}startDrag(...p)}
 else if(ptrs.size===2)startGesture()});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=toBoard(e);ptrs.set(e.pointerId,p);const L=cur();if(!L)return;
 if(gest&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(b[0]-a[0],b[1]-a[1]),ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
  L.scale=Math.min(10,Math.max(.02,gest.s*d/gest.d));L.rot=((gest.r+(ang-gest.ang)*180/Math.PI+540)%360)-180;syncTransform();schedule()}
 else if(drag){L.x=drag.lx+p[0]-drag.sx;L.y=drag.ly+p[1]-drag.sy;schedule()}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)gest=null;if(ptrs.size===1)startDrag(...[...ptrs.values()][0]);if(!ptrs.size)drag=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{const L=cur();if(!L)return;e.preventDefault();L.scale=Math.min(10,Math.max(.02,L.scale*Math.exp(-e.deltaY*.0015)));syncTransform();schedule()},{passive:false});

/* ---------- Panel ---------- */
const slider=(path,label,min,max,step,val)=>`<label class="ctl"><span>${label}<output data-out="${path}">${fmt(+(+val).toFixed(2))}</output></span><input type="range" data-bind="${path}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`;
const colorCtl=(path,label,val)=>`<label class="row" style="justify-content:space-between;font-size:14px"><span>${label}</span><input type="color" data-bind="${path}" value="${val}"></label>`;
const needLayer=`<p class="muted">Select a layer first — tap it on the board or in Layers.</p>`;

function renderPanel(){
 const L=cur(),t=S.tab;
 const tabs=[['layers','Layers'],['key','Key'],['fx','Effects'],['board','Board']].map(([k,n])=>`<button role="tab" aria-selected="${t===k}" data-act="tab" data-v="${k}">${n}</button>`).join('');
 let h='';
 if(t==='layers'){
  h+=`<div class="row"><label class="btn primary" for="file">Add images</label></div>`;
  if(!S.layers.length)h+=`<p class="muted">No layers yet. Each image you add becomes a layer you can key, stack and style.</p>`;
  else{h+=`<div class="layers">`+[...S.layers].reverse().map(l=>`<div class="layer${l.id===S.sel?' sel':''}${l.visible?'':' hidden'}" data-act="select" data-id="${l.id}">
   <img src="${l.thumb}" alt=""><span class="nm">${l.name.replace(/</g,'&lt;')}</span>
   <button class="ib" data-act="vis" data-id="${l.id}" aria-label="${l.visible?'Hide':'Show'} layer">${l.visible?'◉':'○'}</button>
   <button class="ib" data-act="up" data-id="${l.id}" aria-label="Move up">↑</button>
   <button class="ib" data-act="down" data-id="${l.id}" aria-label="Move down">↓</button>
   <button class="ib" data-act="del" data-id="${l.id}" aria-label="Delete layer">✕</button></div>`).join('')+`</div>`;
   if(L){h+=`<h3>${L.name.replace(/</g,'&lt;')}</h3><p class="muted">Drag on the board to move. Pinch or scroll to resize.</p>`+
    slider('scale','Scale',.02,4,.01,L.scale)+slider('rot','Rotation',-180,180,1,Math.round(L.rot))+slider('opacity','Opacity',0,1,.01,L.opacity)+
    `<label class="row" style="justify-content:space-between;font-size:14px"><span>Blend mode</span><select data-bind="blend">${BLENDS.map(([v,n])=>`<option value="${v}"${v===L.blend?' selected':''}>${n}</option>`).join('')}</select></label>
    <div class="row"><button class="btn" data-act="center">Centre</button><button class="btn" data-act="flip">Flip</button><button class="btn" data-act="dup">Duplicate</button></div>`}}
 }else if(t==='key'){
  if(!L)h+=needLayer;else{const k=L.key;
   h+=`<p class="muted">Remove a background by colour (green screen, blue sky, a flat wall) or by brightness.</p>
   <div class="seg">${[['none','Off'],['chroma','Colour'],['luma','Brightness']].map(([v,n])=>`<button class="${k.mode===v?'on':''}" data-act="keymode" data-v="${v}">${n}</button>`).join('')}</div>`;
   if(k.mode==='chroma')h+=`<div class="row"><input type="color" data-keycolor value="${hex(k.color)}" aria-label="Key colour">
    <button class="btn${S.pick?' primary':''}" data-act="pick">${S.pick?'Tap the board…':'Pick from image'}</button>
    <button class="btn" data-act="preset" data-v="#00ff00">Green</button><button class="btn" data-act="preset" data-v="#0047ff">Blue</button></div>`+
    slider('key.tol','Tolerance',0,150,1,k.tol)+slider('key.soft','Edge softness',0,100,1,k.soft)+slider('key.spill','Spill removal',0,1,.01,k.spill);
   if(k.mode==='luma')h+=slider('key.lo','Threshold',0,1,.01,k.lo)+slider('key.lsoft','Edge softness',0,.5,.01,k.lsoft)+
    `<label class="check"><input type="checkbox" data-bind="key.invert"${k.invert?' checked':''}>Remove lights instead of darks</label>`;}
 }else if(t==='fx'){
  if(!L)h+=needLayer;else{
   if(!L.fx.length)h+=`<p class="muted">Effects stack top to bottom on this layer. Add one below.</p>`;
   h+=L.fx.map((f,i)=>{const d=FX[f.type];return`<div class="fx${f.on?'':' off'}"><div class="fxhead">
    <label class="check"><input type="checkbox" data-bind="fx.${i}.on"${f.on?' checked':''} aria-label="Enable ${d.name}"></label><strong>${d.name}</strong>
    ${d.random?`<button class="ib" data-act="fxseed" data-i="${i}" aria-label="Randomise">⟳</button>`:''}
    <button class="ib" data-act="fxup" data-i="${i}" aria-label="Move up">↑</button><button class="ib" data-act="fxdown" data-i="${i}" aria-label="Move down">↓</button>
    <button class="ib" data-act="fxdel" data-i="${i}" aria-label="Remove">✕</button></div>
    ${d.params.map(q=>q[2]==='color'?colorCtl(`fx.${i}.p.${q[0]}`,q[1],f.p[q[0]]):slider(`fx.${i}.p.${q[0]}`,q[1],q[2],q[3],q[4],f.p[q[0]])).join('')}</div>`}).join('');
   h+=`<h3>Add effect</h3><div class="chips">${Object.entries(FX).map(([k,d])=>`<button class="chip" data-act="addfx" data-v="${k}">+ ${d.name}</button>`).join('')}</div>`}
 }else{
  const B=S.board;
  h+=`<h3>Canvas size</h3><div class="seg">${ASPECTS.map(([n,w,hh])=>`<button class="${B.w===w&&B.h===hh?'on':''}" data-act="aspect" data-w="${w}" data-h="${hh}">${n}</button>`).join('')}</div>
  <p class="muted">${B.w} × ${B.h} px</p>
  <label class="row" style="justify-content:space-between;font-size:14px"><span>Background</span><input type="color" data-board="bg" value="${B.bg}"></label>
  <label class="check"><input type="checkbox" data-board="transparent"${B.transparent?' checked':''}>Transparent background</label>
  <div class="row"><button class="btn primary" data-act="export">Export PNG</button></div>`;
 }
 panel.innerHTML=`<div class="tabs" role="tablist">${tabs}</div><div class="body">${h}</div>`;
}

function setPath(o,path,v){const ps=path.split('.');for(let i=0;i<ps.length-1;i++)o=o[ps[i]];o[ps.at(-1)]=v}
function onInput(e){const t=e.target;
 if(t.dataset.bind){const L=cur();if(!L)return;const v=t.type==='checkbox'?t.checked:t.type==='range'?parseFloat(t.value):t.value;
  setPath(L,t.dataset.bind,v);const o=panel.querySelector(`[data-out="${t.dataset.bind}"]`);if(o)o.textContent=fmt(v);
  if(t.dataset.bind.endsWith('.on'))t.closest('.fx')?.classList.toggle('off',!v);
  CHEAP.has(t.dataset.bind.split('.')[0])?schedule():invalidate(L)}
 else if('keycolor' in t.dataset){const L=cur();if(L){L.key.color=rgbOf(t.value);invalidate(L)}}
 else if(t.dataset.board){S.board[t.dataset.board]=t.type==='checkbox'?t.checked:t.value;schedule()}}
panel.addEventListener('input',onInput);panel.addEventListener('change',onInput);

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,L=cur(),id=+b.dataset.id,idx=S.layers.findIndex(l=>l.id===id),i=+b.dataset.i;
 if(a!=='select')e.stopPropagation();
 switch(a){
  case'tab':S.tab=b.dataset.v;if(S.tab!=='key')setPick(false);break;
  case'select':S.sel=id;break;
  case'vis':S.layers[idx].visible=!S.layers[idx].visible;break;
  case'up':if(idx<S.layers.length-1)[S.layers[idx],S.layers[idx+1]]=[S.layers[idx+1],S.layers[idx]];break;
  case'down':if(idx>0)[S.layers[idx],S.layers[idx-1]]=[S.layers[idx-1],S.layers[idx]];break;
  case'del':S.layers.splice(idx,1);if(S.sel===id)S.sel=S.layers.at(-1)?.id??null;break;
  case'center':if(L){L.x=S.board.w/2;L.y=S.board.h/2}break;
  case'flip':if(L)L.flip=!L.flip;break;
  case'dup':if(L){const c={...L,id:uid++,name:L.name+' copy',key:{...L.key,color:[...L.key.color]},fx:L.fx.map(f=>({...f,p:{...f.p}})),x:L.x+40,y:L.y+40,dirty:true};
   S.layers.splice(S.layers.indexOf(L)+1,0,c);S.sel=c.id}break;
  case'keymode':if(L){L.key.mode=b.dataset.v;invalidate(L)}if(b.dataset.v!=='chroma')setPick(false);break;
  case'pick':setPick(!S.pick);break;
  case'preset':if(L){L.key.color=rgbOf(b.dataset.v);invalidate(L)}break;
  case'addfx':if(L){const d=FX[b.dataset.v];L.fx.push({type:b.dataset.v,on:true,seed:Math.random()*1e9|0,p:Object.fromEntries(d.params.map(q=>[q[0],q[2]==='color'?q[3]:q[5]]))});invalidate(L)}break;
  case'fxdel':L.fx.splice(i,1);invalidate(L);break;
  case'fxup':if(i>0){[L.fx[i-1],L.fx[i]]=[L.fx[i],L.fx[i-1]];invalidate(L)}break;
  case'fxdown':if(i<L.fx.length-1){[L.fx[i+1],L.fx[i]]=[L.fx[i],L.fx[i+1]];invalidate(L)}break;
  case'fxseed':L.fx[i].seed=Math.random()*1e9|0;invalidate(L);return;
  case'aspect':{const B=S.board,w=+b.dataset.w,h=+b.dataset.h;for(const l of S.layers){l.x*=w/B.w;l.y*=h/B.h}B.w=cv.width=w;B.h=cv.height=h;break}
  case'export':{for(const l of S.layers)if(l.dirty)process(l);render(false);const url=cv.toDataURL('image/png');render(true);
   $('#outImg').src=url;$('#dl').href=url;$('#modal').classList.add('open');return}
  case'close':$('#modal').classList.remove('open');return;
 }
 schedule();renderPanel();
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.classList.remove('open')});
renderPanel();render(true);
</script>
</body>
</html>
